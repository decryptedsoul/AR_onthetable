services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coconut_grove
      POSTGRES_USER: grove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grove -d coconut_grove"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://grove:${POSTGRES_PASSWORD}@db:5432/coconut_grove
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://grove:${POSTGRES_PASSWORD}@db:5432/coconut_grove
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
volumes:
  postgres_data:
